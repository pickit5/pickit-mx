<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pick It">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data:; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin">
<title>Pick It</title>
<meta name="theme-color" content="#2340A8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}

/* Layout: una columna (máx. 560px) con franja de talavera; tres vistas (cliente, negocio, administrador); barra inferior solo para cliente */
:root{
  --bg:#F5F7FC; --surface:#FFFFFF; --ink:#13204A; --muted:#5A6487;
  --cobalt:#2340A8; --cobalt-soft:#E6EBFA; --sun:#F2B33D; --leaf:#22804D; --leaf-soft:#E3F3EA;
  --warn:#B4531A; --warn-soft:#FBEBDD; --bad:#B42335; --bad-soft:#FBE3E6;
  --line:#DCE1F0; --on-cobalt:#FFFFFF; --scrim:rgba(8,12,30,.5);
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1330; --surface:#151E45; --ink:#EEF1FA; --muted:#A3ACCB;
  --cobalt:#7F9BFF; --cobalt-soft:#1F2B5E; --sun:#F5C15A; --leaf:#62CC91; --leaf-soft:#173A2B;
  --warn:#F0A066; --warn-soft:#3A2614; --bad:#F27B8A; --bad-soft:#3D1820;
  --line:#28336A; --on-cobalt:#0C1330; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1330; --surface:#151E45; --ink:#EEF1FA; --muted:#A3ACCB;
  --cobalt:#7F9BFF; --cobalt-soft:#1F2B5E; --sun:#F5C15A; --leaf:#62CC91; --leaf-soft:#173A2B;
  --warn:#F0A066; --warn-soft:#3A2614; --bad:#F27B8A; --bad-soft:#3D1820;
  --line:#28336A; --on-cobalt:#0C1330; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.has-tabs{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:14px 28px}
.stack{display:flex;flex-direction:column;gap:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
a{color:var(--cobalt)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand svg{width:38px;height:38px;flex:none}
.brand b{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em}
.brand small{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:-3px}
.tiles{height:14px;border-radius:4px;
  background:radial-gradient(circle at 50% 50%,var(--sun) 0 2.5px,transparent 3px) 0 0/14px 14px,
  conic-gradient(from 45deg,var(--cobalt) 0 25%,var(--cobalt-soft) 0 50%,var(--cobalt) 0 75%,var(--cobalt-soft) 0) 0 0/14px 14px}
.demo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);background:var(--cobalt-soft);border-radius:12px;padding:8px 10px}
.demo b{color:var(--ink)}
.seg{display:flex;gap:4px;background:var(--surface);border-radius:10px;padding:3px;border:1px solid var(--line)}
.seg button{border:none;background:transparent;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--cobalt);color:var(--on-cobalt)}

h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,7vw,34px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-family:var(--display);font-weight:800;font-size:18px;margin:0}
.lead{margin:6px 0 0;color:var(--muted)}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--cobalt);margin-bottom:6px}
.meta{color:var(--muted);font-size:13px}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trust div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.3;font-weight:600}
.trust svg{width:20px;height:20px;color:var(--leaf)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:var(--on-cobalt)}

.list{display:flex;flex-direction:column;gap:12px}
.card{display:grid;grid-template-columns:60px 1fr;gap:14px;align-items:start;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.card.soldout{opacity:.6}
.thumb{width:60px;height:60px;border-radius:12px;display:grid;place-items:center;background:var(--cobalt-soft);color:var(--cobalt)}
.thumb svg{width:28px;height:28px}
.body{min-width:0;display:flex;flex-direction:column;gap:4px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row>*{min-width:0}
.name{font-weight:700;font-size:16px;line-height:1.2}
.price{font-family:var(--display);font-weight:800;font-size:20px;white-space:nowrap;font-variant-numeric:tabular-nums}
.was{color:var(--muted);text-decoration:line-through;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:12px;font-weight:600;border-radius:6px;padding:3px 8px;background:var(--leaf-soft);color:var(--leaf);white-space:nowrap}
.tag.blue{background:var(--cobalt-soft);color:var(--cobalt)}
.tag.sun{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--sun)}
.tag.grey{background:var(--line);color:var(--muted)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.stars{color:var(--sun);letter-spacing:1px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel.alert{border-color:var(--warn);background:var(--warn-soft)}
.panel.bad{border-color:var(--bad);background:var(--bad-soft)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.kpi b{display:block;font-family:var(--display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted)}
.code{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.06em;color:var(--cobalt)}
.empty{text-align:center;color:var(--muted);padding:28px 14px;border:1.5px dashed var(--line);border-radius:16px}
.btn{border:none;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--cobalt);color:var(--on-cobalt);text-align:center;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.small{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn.wide{width:100%;font-size:16px;padding:15px}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs-inline{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs-inline button{border:none;background:transparent;padding:10px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;flex:none}
.tabs-inline button[aria-selected="true"]{color:var(--cobalt);border-bottom-color:var(--cobalt)}

form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:15px;color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}
.err{color:var(--bad);font-size:13.5px;font-weight:600}

table{width:100%;border-collapse:collapse;font-size:13.5px}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:none}
td.num{text-align:right;font-variant-numeric:tabular-nums}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav.tabs button{border:none;background:transparent;border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:600;color:var(--muted)}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--cobalt);background:var(--cobalt-soft)}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--sun);color:#13204A;font-size:11px;font-weight:700;display:inline-grid;place-items:center;padding:0 5px;margin-left:4px}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:580px;background:var(--surface);border-radius:22px 22px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;max-height:90%;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.box{background:var(--bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:7px;font-size:14px}
.box>div{display:flex;justify-content:space-between;gap:12px}
.box>div>span:first-child{color:var(--muted)}
.box>div>*:last-child{text-align:right}
.step{display:flex;align-items:center;gap:14px}
.step button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;font-weight:700}
.step output{font-family:var(--display);font-weight:800;font-size:22px;min-width:22px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.how{display:flex;flex-direction:column;gap:10px;counter-reset:s}
.how li{list-style:none;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.how li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--cobalt);color:var(--on-cobalt);display:grid;place-items:center;font-weight:700;font-size:13px}
.how{padding:0;margin:0}
.ratebtns{display:flex;gap:6px}
.ratebtns button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;font-size:18px;color:var(--sun)}
.clabe{font-variant-numeric:tabular-nums;letter-spacing:.02em;word-break:break-all}
form.row input{flex:1}
footer.foot{font-size:13px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:6px}
@media (max-width:420px){.trust{grid-template-columns:1fr}.trust div{flex-direction:row;align-items:center}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <a class="brand" href="#" id="home">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="var(--cobalt)"/><path d="M12 16h16l-1.6 14.2a2 2 0 0 1-2 1.8H15.6a2 2 0 0 1-2-1.8z" fill="var(--on-cobalt)"/><path d="M16 16v-2a4 4 0 0 1 8 0v2" fill="none" stroke="var(--on-cobalt)" stroke-width="2.2" stroke-linecap="round"/><circle cx="20" cy="23.5" r="2.6" fill="var(--sun)"/></svg>
      <span><b>Pick It</b><small id="subtitle">Rescate de comida</small></span>

</div>

    <button id="tabOrders"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 7h12l-1.2 13.1a1 1 0 0 1-1 .9H8.2a1 1 0 0 1-1-.9zm3 0V6a3 3 0 0 1 6 0v1h-2V6a1 1 0 0 0-2 0v1z"/></svg><span>Mis pedidos<span class="badge" id="badge" hidden>0</span></span></button>
  </div>
</nav>

<script>
"use strict";
const CFG=Object.assign({SUPABASE_URL:"",SUPABASE_ANON_KEY:"",WHATSAPP_SOPORTE:"",ZONA:"Centro Histórico · Puebla"},window.PICKIT_CONFIG||{});
const CFG_OK=!!window.PICKIT_CONFIG;
const DEMO=CFG_OK&&!CFG.SUPABASE_URL;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>{const v=Math.round(Number(n||0)*100)/100;return "$"+v.toLocaleString("es-MX",{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})};
const TZ="America/Mexico_City";
const today=()=>new Intl.DateTimeFormat("en-CA",{timeZone:TZ}).format(new Date());
const dayOf=ts=>new Intl.DateTimeFormat("en-CA",{timeZone:TZ}).format(new Date(ts));
const nowHM=()=>new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date());
const addDays=(d,n)=>{const x=new Date(d+"T12:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const weekStart=d=>{const x=new Date(d+"T12:00:00Z");return addDays(d,-((x.getUTCDay()+6)%7))};
const fmtDate=d=>d?new Date(d+"T12:00:00Z").toLocaleDateString("es-MX",{day:"numeric",month:"short",timeZone:"UTC"}):"—";
const hm=t=>String(t||"").slice(0,5);
const monthStart=()=>today().slice(0,8)+"01";
const sum=(a,k)=>a.reduce((s,o)=>s+Number(o[k]||0),0);
const kg=n=>Number(n||0).toLocaleString("es-MX",{maximumFractionDigits:1});
function ls(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const CATS=["Panadería","Comida corrida","Antojitos","Cafés","Dulces","Otro"];
const ICONS={
 "Panadería":'<path fill="currentColor" d="M4 13c0-4.4 3.6-8 8-8s8 3.6 8 8v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm5-2v6h2v-6zm4 0v6h2v-6z"/>',
 "Comida corrida":'<path fill="currentColor" d="M3 11h18a9 9 0 0 1-18 0M7 3.5c1.2 1.2 1.2 2.6 0 3.8M11.5 3.5c1.2 1.2 1.2 2.6 0 3.8M16 3.5c1.2 1.2 1.2 2.6 0 3.8" stroke="currentColor" stroke-width="1.6"/>',
 "Antojitos":'<path fill="currentColor" d="M3 15a9 9 0 0 1 18 0v1H3zm-1 3h20v2H2z"/>',
 "Cafés":'<path fill="currentColor" d="M4 8h13v5a6 6 0 0 1-12 0zm13 1h1.5a2.5 2.5 0 0 1 0 5H17v-2h1.5a.5.5 0 0 0 0-1H17zM4 20h14v2H4z"/>',
 "Dulces":'<path fill="currentColor" d="M8 8h8v8H8zM3 9l5 3-5 3zm18 0v6l-5-3z"/>',
 "Otro":'<path fill="currentColor" d="M6 7h12l-1.2 13.1a1 1 0 0 1-1 .9H8.2a1 1 0 0 1-1-.9zm3 0V6a3 3 0 0 1 6 0v1h-2V6a1 1 0 0 0-2 0v1z"/>'
};
const icon=c=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[c]||ICONS.Otro)+'</svg>';
const stars=r=>r?'<span class="stars">★</span> '+Number(r).toFixed(1):'';
const STATUS={pendiente_pago:["Falta pagar","warn"],apartado:["Pagado · por recoger","blue"],recogido:["Recogido",""],cancelado:["Cancelado","grey"],
  no_recogido:["No lo recogió","bad"],por_reembolsar:["Por reembolsar","warn"],reembolsado:["Reembolsado","grey"]};
const PAID=["apartado","recogido","no_recogido"];
const st=s=>STATUS[s]||[s,"grey"];
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(el._t);el._t=setTimeout(()=>el.hidden=true,3200)}
function openSheet(html){$("#sheet").innerHTML=html;$("#scrim").hidden=false;const f=$("#sheet").querySelector("button,input");if(f)f.focus()}
function closeSheet(){$("#scrim").hidden=true}
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
const genCode=()=>"PK-"+Array.from({length:5},()=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*31)]).join("");
function confirmTap(btn,label){if(btn.dataset.c==="1")return true;btn.dataset.c="1";btn.dataset.orig=btn.textContent;btn.textContent=label;setTimeout(()=>{if(btn.isConnected){btn.dataset.c="";btn.textContent=btn.dataset.orig}},4000);return false}
async function copy(text,btn){try{await navigator.clipboard.writeText(text);toast("Copiado")}catch(e){const r=document.createRange();const el=btn.previousElementSibling;if(el){r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast("Selecciónalo y cópialo")}}

/* =================== Datos: DEMO =================== */
function demoSeed(){
  const t=today(),ws=weekStart(t);
  const B=[

function friendly(m){
  const M=[[/Invalid login/i,"Correo o contraseña incorrectos."],[/already registered/i,"Ese correo ya tiene cuenta. Entra con tu contraseña."],[/Password should|weak/i,"La contraseña debe tener al menos 8 caracteres, con letras y números."],
    [/AGOTADO/,"Ya no quedan suficientes bolsas."],[/LIMITE/,"Ya tienes 3 pedidos activos hoy con ese teléfono. Intenta más tarde."],[/CERRADO/,"El horario para recoger esta bolsa ya pasó."],
    [/DATOS/,"Revisa tu nombre y tu WhatsApp a 10 dígitos."],[/SIN_PAGO/,"Ese pedido aún no está pagado. No lo entregues."],[/CODIGO/,"Ese código no existe, ya se entregó o no es de tu negocio."],
    [/SIN_SALDO/,"Ese negocio no tiene saldo por pagar."],[/NO_PERMITIDO|permission denied/i,"No tienes permiso para hacer eso."],[/clabe/i,"La CLABE debe tener 18 dígitos."],[/Failed to fetch|NetworkError/i,"Sin conexión. Revisa tu internet."]];
  for(const [r,t] of M)if(r.test(m))return t;return "Algo salió mal. Intenta de nuevo."}

      ${err?`<div class="err">${esc(err)}</div>`:""}<button class="btn wide" id="resBtn">Pagar ${money(o.price*q)}</button>

    <button class="btn ghost wide" id="closeS">Cerrar</button>`);bind()};

  $("#subtitle").textContent="Administración";
  const u=await api.session();if(!u)return loginView("admin",renderAdmin);
  if(!(await api.isAdmin())){$("#app").innerHTML=`<div class="panel bad"><b>Esta cuenta no es administradora.</b><span>Agrega tu correo en la tabla admins de Supabase (ver README).</span></div><button class="btn ghost" id="out">Salir</button>`;$("#out").onclick=async()=>{await api.signOut();route()};return}
  const t=today(),ws=weekStart(t);
  const [bs,os,pend,set]=await Promise.all([api.adminBusinesses(),api.adminOrders(addDays(t,-45)),api.pendingPayouts(),api.getSettings()]);SETTINGS=set;
  const paid=os.filter(o=>PAID.includes(o.status));
  const wk=paid.filter(o=>dayOf(o.paid_at)>=ws),mo=paid.filter(o=>dayOf(o.paid_at)>=monthStart());
  const mpFee=a=>a.reduce((s,o)=>s+Number(o.total)*0.036*1.16,0);
  const pendB=bs.filter(b=>b.status==="pendiente"),refund=os.filter(o=>o.status==="por_reembolsar"),noClabe=pend.filter(p=>!p.clabe);
  $("#app").innerHTML=`<section class="row" style="align-items:center"><div><div class="eyebrow">Pick It</div><h2>Administración</h2></div><button class="btn ghost small" id="out">Salir</button></section>
    <div class="kpis"><div class="kpi"><b>${money(sum(pend,"net"))}</b><span>por depositar a ${pend.length} ${pend.length===1?"negocio":"negocios"} (semanas cerradas)</span></div>
    <div class="kpi"><b>${money(sum(mo,"commission")-mpFee(mo))}</b><span>tu ganancia del mes (comisión menos Clip, aprox.)</span></div>
    <div class="kpi"><b>${money(sum(wk,"total"))}</b><span>cobrado esta semana</span></div>
    <div class="kpi"><b>${sum(mo,"qty")}</b><span>bolsas vendidas este mes</span></div></div>
    ${pendB.length||refund.length||noClabe.length?`<div class="panel alert"><b>Por revisar</b>
      ${pendB.map(b=>`<span>${esc(b.name)}: registro nuevo esperando aprobación</span>`).join("")}
      ${refund.map(o=>`<span>Pedido ${esc(o.code)} (${money(o.total)}): pagó sin bolsas disponibles. Reembólsalo desde tu panel de Clip.</span>`).join("")}
      ${noClabe.map(p=>`<span>${esc(p.name)} tiene saldo pero no ha registrado su CLABE.</span>`).join("")}</div>`:`<div class="panel"><b>Todo en orden.</b><span class="meta">No hay negocios por aprobar ni reembolsos pendientes.</span></div>`}
    <div class="tabs-inline" role="tablist">${[["pagos","Pagos del lunes"],["negocios","Negocios"],["pedidos","Pedidos"],["ajustes","Ajustes"]].map(([k,l])=>`<button role="tab" data-a="${k}" aria-selected="${admTab===k}">${l}</button>`).join("")}</div><div id="admBody" class="stack"></div>`;
  $("#out").onclick=async()=>{await api.signOut();route()};
  document.querySelectorAll("[data-a]").forEach(x=>x.onclick=()=>{admTab=x.dataset.a;renderAdmin()});
  const body=$("#admBody");
  if(admTab==="pagos"){
    const hist=await api.adminPayouts();const nm=id=>(bs.find(b=>b.id===id)||{}).name||"—";
    body.innerHTML=`<span class="meta">Incluye todo lo pagado por clientes hasta el domingo ${fmtDate(addDays(ws,-1))}. Transfiere desde tu banco y luego registra el depósito.</span>
      ${pend.length?pend.map(p=>`<div class="panel"><div class="row"><span class="name">${esc(p.name)}</span><span class="price">${money(p.net)}</span></div>
        <span class="meta">${p.orders_count} pedidos · vendido ${money(p.gross)} · comisión ${money(p.commission)}</span>
        ${p.clabe?`<div class="box"><div><span>CLABE</span><span class="row" style="justify-content:flex-end;gap:8px"><b class="clabe">${esc(p.clabe)}</b><button class="btn ghost small" data-copy="${esc(p.clabe)}">Copiar</button></span></div><div><span>Titular</span><span>${esc(p.bank_holder||"—")}</span></div><div><span>Monto</span><b>${money(p.net)}</b></div></div>
        <form class="row" data-payout="${esc(p.business_id)}" data-net="${p.net}"><input placeholder="Referencia o clave de rastreo" maxlength="60" aria-label="Referencia del depósito"><button class="btn small">Ya transferí</button></form>`
        :`<span class="err">Sin CLABE registrada. Pídele por WhatsApp (${esc(p.phone)}) que la agregue en “Mi negocio”.</span>`}</div>`).join("")
      :'<div class="empty">No hay pagos pendientes. Todo lo de semanas anteriores ya está depositado.</div>'}
      <h3>Últimos depósitos</h3>${hist.length?`<div class="tablebox"><table><thead><tr><th>Negocio</th><th class="num">Depositado</th></tr></thead><tbody>
      ${hist.map(h=>`<tr><td style="white-space:normal">${esc(nm(h.business_id))}<br><span class="meta">${fmtDate(dayOf(h.paid_at))} · ${esc(h.reference||"")}</span></td><td class="num">${money(h.net)}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">Aún no registras depósitos.</div>'}`;
    body.onclick=e=>{const c=e.target.closest("[data-copy]");if(c)copy(c.dataset.copy,c)};
    body.querySelectorAll("[data-payout]").forEach(f=>f.onsubmit=async e=>{e.preventDefault();const btn=f.querySelector("button");
      if(!confirmTap(btn,"Confirmar "+money(f.dataset.net)))return;btn.disabled=true;
      try{await api.createPayout(f.dataset.payout,f.querySelector("input").value.trim());toast("Depósito registrado");renderAdmin()}catch(err){toast(err.message);btn.disabled=false}});
  }else if(admTab==="negocios"){
    const per=id=>paid.filter(o=>o.business_id===id&&dayOf(o.paid_at)>=addDays(t,-29));
    body.innerHTML=bs.map(b=>{const s=b.status==="pendiente"?'<span class="tag warn">Por aprobar</span>':b.status==="suspendido"?'<span class="tag bad">Suspendido</span>':'<span class="tag">Activo</span>';
      return `<div class="panel"><div class="row"><span class="name">${esc(b.name)}</span>${s}</div>
        <span class="meta">${esc(b.category)} · ${esc(b.address)} · Tel. ${esc(b.phone)}</span>
        <span class="meta">30 días: <b>${sum(per(b.id),"qty")}</b> bolsas · <b>${money(sum(per(b.id),"total"))}</b> cobrados · CLABE ${b.clabe?"registrada":"pendiente"}</span>
        <div class="actions">${b.status==="pendiente"?`<button class="btn small" data-ok="${esc(b.id)}">Aprobar</button>`:""}<button class="btn ghost small" data-sus="${esc(b.id)}">${b.status==="activo"?"Suspender":b.status==="pendiente"?"Rechazar":"Reactivar"}</button></div></div>`}).join("")||'<div class="empty">Aún no se registra ningún negocio.</div>';
    body.onclick=async e=>{const x=e.target.closest("button");if(!x)return;
      if(x.dataset.ok){await api.adminUpdateBusiness(x.dataset.ok,{status:"activo"});toast("Negocio aprobado");renderAdmin()}
      if(x.dataset.sus){const b=bs.find(y=>String(y.id)===x.dataset.sus);if(b.status==="activo"&&!confirmTap(x,"¿Suspender? Toca otra vez"))return;await api.adminUpdateBusiness(b.id,{status:b.status==="suspendido"?"activo":"suspendido"});renderAdmin()}};
  }else if(admTab==="pedidos"){
    const nm=id=>(bs.find(b=>b.id===id)||{}).name||"—";const real=os.filter(o=>o.status!=="cancelado"&&o.status!=="pendiente_pago");
    const ns=real.filter(o=>o.status==="no_recogido").length;
    body.innerHTML=`<span class="meta">Últimos 45 días · ${real.length} pedidos pagados · ${real.length?Math.round(ns/real.length*100):0}% no recogidos</span>
      ${refund.map(o=>`<div class="panel alert"><div class="row"><b>Reembolso pendiente · ${esc(o.code)}</b><b>${money(o.total)}</b></div><span>${esc(nm(o.business_id))} · ${esc(o.customer_name)} · WhatsApp ${esc(o.customer_phone)}</span>
        <span class="meta">Devuélvelo desde tu panel de Clip (busca el cobro → Reembolsar). Se marcará solo; si no, usa este botón.</span><button class="btn ghost small" data-ref="${esc(o.id)}">Ya lo reembolsé</button></div>`).join("")}
      <div class="tablebox"><table><thead><tr><th>Fecha</th><th>Negocio</th><th>Cliente</th><th class="num">Total</th><th>Estado</th></tr></thead><tbody>
      ${real.slice().sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))).slice(0,80).map(o=>{const [l,c]=st(o.status);return `<tr><td>${fmtDate(dayOf(o.created_at))}</td><td>${esc(nm(o.business_id))}</td><td>${esc(o.customer_name)}</td><td class="num">${money(o.total)}</td><td><span class="tag ${c}">${l}</span></td></tr>`}).join("")}
      </tbody></table></div>`;
    body.onclick=async e=>{const x=e.target.closest("[data-ref]");if(!x)return;if(!confirmTap(x,"Confirmar reembolso"))return;await api.markRefunded(x.dataset.ref);toast("Marcado como reembolsado");renderAdmin()};
  }else{
    const ex=60,fee=ex*0.036*1.16,com=ex*SETTINGS.commission_pct/100;
    body.innerHTML=`<form class="panel" id="setForm"><h3>Comisión de Pick It</h3>
      <label>Porcentaje que te quedas de cada venta<input id="sPct" type="number" min="0" max="60" step="0.5" value="${SETTINGS.commission_pct}"></label>
      <label>Minutos para pagar antes de liberar la bolsa<input id="sHold" type="number" min="5" max="60" value="${SETTINGS.hold_minutes}"></label>
      <div class="box"><div><span>Ejemplo: bolsa de</span><b>${money(ex)}</b></div><div><span>Tu comisión (${SETTINGS.commission_pct}%)</span><span>${money(com)}</span></div>
        <div><span>Clip (aprox. 3.6% + IVA)</span><span>−${money(fee.toFixed(2))}</span></div><div><span>Te queda</span><b>${money((com-fee).toFixed(2))}</b></div><div><span>Recibe el negocio</span><span>${money(ex-com)}</span></div></div>
      <span class="hint">El cambio aplica a pedidos nuevos. Los ya pagados conservan su comisión. Revisa la tarifa real en tu cuenta de Clip.</span>
      <div class="err" id="sErr"></div><button class="btn">Guardar</button></form>`;
    $("#setForm").onsubmit=async e=>{e.preventDefault();try{await api.updateSettings({commission_pct:+$("#sPct").value,hold_minutes:+$("#sHold").value});toast("Ajustes guardados");renderAdmin()}catch(err){$("#sErr").textContent=err.message}};
  }
}

/* =================== RUTAS =================== */
let demoView=null;
function currentView(){if(DEMO&&demoView)return demoView;const h=location.hash.replace("#","");return h==="negocio"||h==="admin"?h:"cliente"}
async function route(){
  closeSheet();const v=currentView();
  document.body.classList.remove("has-tabs");$("#custTabs").hidden=true;
  if(DEMO){$("#demoBar").hidden=false;document.querySelectorAll("#demoBar [data-view]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===v))}
  try{await({cliente:renderCliente,negocio:renderNegocio,admin:renderAdmin})[v]()}catch(e){console.error(e);$("#app").innerHTML=`<div class="panel bad"><b>Algo salió mal.</b><span>${esc(e.message)}</span></div>`}
  scrollTo(0,0);
}
document.querySelectorAll("#demoBar [data-view]").forEach(b=>b.onclick=()=>{demoView=b.dataset.view;route()});
$("#home").onclick=e=>{e.preventDefault();demoView="cliente";custTab="explore";try{history.replaceState(null,"",location.pathname)}catch(x){}route()};
window.addEventListener("hashchange",()=>{demoView=null;route()});
let deferred=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("#installBtn").hidden=false});
$("#installBtn").onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$("#installBtn").hidden=true};

(async()=>{
  if(!CFG_OK){$("#app").innerHTML=`<div class="panel bad"><b>La app no está configurada.</b><span>Revisa el archivo config.js.</span></div>`;return}
  if(!DEMO){try{await loadSupabase();sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY)}catch(e){$("#app").innerHTML=`<div class="panel bad"><b>Sin conexión.</b><span>${esc(e.message)}</span></div>`;return}
    try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}}
  let ret=null;try{ret=new URLSearchParams(location.search).get("pago")}catch(e){}
  if(ret&&/^PK-[A-Z0-9]{5}$/.test(ret)){try{history.replaceState(null,"",location.pathname)}catch(e){}custTab="orders";await route();await afterPaymentReturn(ret);route();return}
  route();
})();
</script>
</body>
